<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI Video Pro - Create long AI videos from your ideas"
  >

  <title>🎬 AI Video Pro</title>

  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="logo">
      🎬 <span>AI Video Pro</span>
    </div>

    <button class="upgrade-btn" type="button">
      ⭐ Upgrade
    </button>
  </header>


  <main class="container">

    <section class="hero">
      <h1>🎬 Create Long Videos with AI</h1>

      <p>
        Turn your ideas into amazing 1–10 minute AI videos
      </p>
    </section>


    <section class="card">

      <h2>✨ Describe your video</h2>

      <textarea
        id="prompt"
        placeholder="Example: Create a cinematic 5-minute story about a beautiful Indian village..."
      ></textarea>


      <label
        class="upload-box"
        for="image"
      >
        🖼️ Upload Reference Image

        <input
          type="file"
          id="image"
          accept="image/*"
        >
      </label>


      <div class="field">

        <label for="model">
          🤖 AI Model
        </label>

        <select id="model">

          <option value="free">
            Free Video
          </option>

          <option value="cinematic">
            Cinematic Video
          </option>

          <option value="realistic">
            Realistic Video
          </option>

        </select>

      </div>


      <div class="field">

        <label for="duration">
          ⏱️ Video Duration
        </label>

        <select id="duration">

          <option value="1">
            1 Minute
          </option>

          <option value="3">
            3 Minutes
          </option>

          <option value="5" selected>
            5 Minutes
          </option>

          <option value="8">
            8 Minutes
          </option>

          <option value="10">
            10 Minutes
          </option>

        </select>

      </div>


      <div class="field">

        <label for="ratio">
          📐 Video Format
        </label>

        <select id="ratio">

          <option value="9:16">
            9:16 — Shorts / Reels
          </option>

          <option value="16:9">
            16:9 — YouTube
          </option>

          <option value="1:1">
            1:1 — Square
          </option>

        </select>

      </div>


      <button
        id="generateBtn"
        class="generate-btn"
        type="button"
      >
        🚀 Generate Video
      </button>

    </section>


    <section class="card preview-card">

      <h2>🎬 Video Preview</h2>

      <div
        id="preview"
        class="preview"
      >

        <div class="video-status">

          <div class="play-icon">
            ▶
          </div>

          <p>
            Your generated video will appear here
          </p>

        </div>

      </div>

    </section>

  </main>


  <footer>
    © 2026 AI Video Pro • Powered by AI
  </footer>


  <script src="script.js"></script>

</body>
  </html>
